<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智能深蹲教练</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.11.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/posenet@2.2.2"></script>
</head>
<body>
    <div class="app-container">
        <header>
            <div class="stat-box">
                <span class="label">深蹲个数</span>
                <span class="value big" id="count">0</span>
            </div>
            <div class="stat-box">
                <span class="label">当前状态</span>
                <span class="value" id="state-badge">站立</span>
            </div>
            <div class="stat-box">
                <span class="label">置信度</span>
                <span class="value" id="accuracy">0%</span>
            </div>
        </header>

        <div class="camera-wrapper">
            <video id="video" playsinline></video>
            <canvas id="output"></canvas>
            
            <div id="loading" class="overlay">
                <div class="spinner"></div>
                <p>正在连接硬件...</p>
            </div>
            
            <div id="feedback" class="feedback-toast hidden">请下蹲！</div>
        </div>

        <div class="controls">
            <button id="startBtn" onclick="startCoach()">📸 开启 AI 教练</button>
            <div class="options">
                <label>
                    <input type="checkbox" id="voiceToggle" checked> 🔊 启用语音指导
                </label>
            </div>
        </div>
        
        <p class="tips">
            💡 <b>使用说明：</b><br>
            1. 请务必<b>侧身</b>对着摄像头，露出全身。<br>
            2. AI 将通过 Google Key 验证（如已启用云服务）。<br>
            3. 确保光线充足，背景整洁。
        </p>
    </div>

    <script src="script.js"></script>
</body>
</html>
