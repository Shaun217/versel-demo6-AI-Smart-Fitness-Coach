<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 智能深蹲教练</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.11.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/posenet@2.2.2"></script>
</head>
<body>
    <div class="app-container">
        <header>
            <div class="stat-box">
                <span class="label">个数</span>
                <span class="value big" id="count">0</span>
            </div>
            <div class="stat-box">
                <span class="label">状态</span>
                <span class="value" id="state-badge">站立</span>
            </div>
            <div class="stat-box">
                <span class="label">置信度</span>
                <span class="value" id="accuracy">0%</span>
            </div>
        </header>

        <div class="camera-wrapper">
            <video id="video" playsinline></video>
            <canvas id="output"></canvas>
            
            <div id="loading" class="overlay hidden">
                <div class="spinner"></div>
                <p>正在连接...</p>
            </div>
            
            <div id="feedback" class="feedback-toast hidden">请下蹲！</div>
        </div>

        <div class="controls">
            <div class="btn-group">
                <button id="startBtn" onclick="startCoach()">📸 开启教练</button>
                <button id="switchBtn" class="secondary hidden" onclick="toggleCamera()">🔄 切换镜头</button>
            </div>

            <div class="options">
                <label>
                    <input type="checkbox" id="voiceToggle" checked> 🔊 语音指导
                </label>
            </div>
        </div>
        
        <p class="tips">
            💡 <b>提示：</b><br>
            1. 画面已调整为竖屏，更容易全身入镜。<br>
            2. 请侧身站立，确保<b>脚踝</b>到<b>腰部</b>都在框内。
        </p>
    </div>

    <script src="script.js"></script>
</body>
</html>
